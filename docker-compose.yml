# Copy `.env.example` to `.env` and edit before `docker compose up`.

services:
  oxicloud-public-proxy:
    # `docker compose up -d` pulls the published image; add `--build` to
    # build from this checkout instead. Bump the tag with each release.
    build: .
    image: ghcr.io/jagasme/oxicloud-public-proxy:1.0.0-oxi091.3
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    # Uncomment if running on the same Docker network as OxiCloud:
    # networks:
    #   - oxicloud
    # external: true

# networks:
#   oxicloud:
#     external: true
