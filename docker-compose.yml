# Copy `.env.example` to `.env` and edit before `docker compose up`.

services:
  oxicloud-public-proxy:
    # The published release image. Bump the tag with each release. To build
    # from this checkout instead, add the override (tags the image `:local`,
    # so a local build never masquerades as a release):
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/jagasme/oxicloud-public-proxy:2.0.0
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    # Uncomment if running on the same Docker network as OxiCloud:
    # networks:
    #   - oxicloud
    # external: true

# networks:
#   oxicloud:
#     external: true
