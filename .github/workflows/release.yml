name: Release

# Push a tag matching package.json "version", e.g.:
#   git tag v1.0.0-oxi091.3 && git push origin v1.0.0-oxi091.3
# Publishes ghcr.io/<owner>/oxicloud-public-proxy for amd64 + arm64, signs it
# with cosign (keyless), and creates a GitHub Release with generated notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing + build provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        # v1.0.0-oxi091.3 -> version 1.0.0-oxi091.3, line 1.0.0-oxi091.
        # The line tag moves with each fork patch release; no "latest" tag.
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "line=${version%.*}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.line }},enable=${{ steps.ver.outputs.line != steps.ver.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image="ghcr.io/${REPO,,}"
          cat > notes.md <<NOTES
          ## Container image

          \`\`\`
          ${image}:${TAG#v}
          ${image}@${DIGEST}
          \`\`\`

          Verify the signature:

          \`\`\`
          cosign verify ${image}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes
