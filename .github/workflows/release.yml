name: Release

# Push a tag matching package.json "version", e.g.:
#   git tag v2.1.0 && git push origin v2.1.0
# Publishes ghcr.io/<owner>/oxicloud-public-proxy for amd64 + arm64, signs it
# with cosign (keyless), and creates a GitHub Release with generated notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit must be on main
        # main only changes through reviewed PRs (ruleset protect-main), so a
        # tag pushed onto any other commit is refused instead of published.
        # Tags themselves are protected by the protect-release-tags ruleset.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main; release tags must point at merged commits"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        # Only vX.Y.Z or vX.Y.Z-prerelease. SemVer build metadata (+...) is
        # refused: "+" is not a legal character in an image tag, so the push
        # would fail, and the floating-tag logic below assumes this shape.
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-prerelease (no +build metadata)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing + build provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        # v2.0.1 -> tags 2.0.1, 2.0 and 2. The 2.0 and 2 tags move to the
        # newest release in that line; no "latest" tag. A pre-release
        # (v2.1.0-rc.1) gets only its full tag, so it never moves 2.1 or 2.
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "major=" >> "$GITHUB_OUTPUT"
          else
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
            echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.minor != '' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.major != '' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image="ghcr.io/${REPO,,}"
          cat > notes.md <<NOTES
          ## Container image

          \`\`\`
          ${image}:${TAG#v}
          ${image}@${DIGEST}
          \`\`\`

          Verify the signature (pins the release workflow and this tag, not
          just the repository):

          \`\`\`
          cosign verify ${image}@${DIGEST} \\
            --certificate-identity 'https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes
